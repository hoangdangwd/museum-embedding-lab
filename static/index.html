<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f3ee">
  <title>Nhận diện hiện vật</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <main class="app">
    <header><span class="brand">HIỆN VẬT</span><button id="logout" class="icon-button" aria-label="Đổi tên người dùng" title="Đổi tên người dùng"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg></button></header>
    <section id="viewfinder" class="viewfinder" aria-label="Camera nhận diện">
      <video id="cameraVideo" autoplay playsinline muted hidden aria-label="Hình ảnh từ camera"></video>
      <img id="photo" alt="Ảnh vừa chụp" hidden>
      <div id="cameraStart" class="camera-start">
        <svg class="camera-symbol" viewBox="0 0 48 48" aria-hidden="true"><path d="M7 14h9l4-5h8l4 5h9v26H7z"/><circle cx="24" cy="26" r="8"/></svg>
        <button id="openCamera" class="light-button">Mở camera</button>
      </div>
      <div id="frame" class="frame" hidden aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div id="processing" class="processing" hidden role="status"><span class="spinner"></span><span>Đang nhận diện…</span></div>
      <div id="captureControls" class="capture-controls" hidden><button id="capturePhoto" class="shutter" aria-label="Chụp ảnh"><span></span></button></div>
    </section>
    <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
    <section id="result" class="result" hidden aria-live="polite"><h1 id="resultName"></h1><button id="retake" class="primary-button">Chụp lại</button></section>
  </main>
</body>
</html>
